<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <title>《土豆庄园》知识库</title>
  <meta name="description" content="《土豆庄园》的产品设计、架构契约、场景内容、任务卡与验收证据。" />
  <link rel="stylesheet" href="_assets/vue.css" />
  <link rel="stylesheet" href="_assets/custom.css" />
  <link rel="stylesheet" href="_assets/gate.css" />
</head>
<body>
  <div id="kb-lock" class="kb-lock">
    <div class="kb-lock-card">
      <h1>《土豆庄园》知识库</h1>
      <p>该知识库已加密，请输入访问口令。</p>
      <form id="kb-unlock-form" autocomplete="off">
        <input id="kb-password" type="password" placeholder="访问口令" autocomplete="current-password" />
        <button id="kb-unlock-btn" type="submit">解锁</button>
      </form>
      <label class="kb-remember"><input id="kb-remember" type="checkbox" /> 在本机记住 7 天</label>
      <p id="kb-error" class="kb-error" role="alert"></p>
      <p class="kb-lock-foot">内容以密文形式保存，输入正确口令后才能解密阅读。</p>
    </div>
  </div>
  <div id="app">正在加载知识库…</div>
  <script>
    window.$docsify = {
      name: "《土豆庄园》知识库",
      nameLink: './',
    repo: "https://github.com/yal-babe/aloo-townlet-docs-site",
      homepage: 'home.md',
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      subMaxLevel: 2,
      auto2top: true,
      externalLinkTarget: '_blank',
      externalLinkRel: 'noopener noreferrer',
      noCompileLinks: ['.*\\.json'],
      search: {
        placeholder: '搜索全文…',
        noData: '没有匹配的文档',
        paths: ["home.md","product/game-design.md","architecture/overview.md","architecture/client.md","architecture/server.md","architecture/shared-contract.md","design/contracts/delivery-rules.md","design/contracts/items-registry.md","design/contracts/quests-registry.md","design/contracts/cat-polaroid-registry.md","design/contracts/effects-registry.md","design/contracts/state-registry.md","design/contracts/verification-protocol.md","design/scenes/story-bible.md","design/scenes/scene-story-and-quests.md","design/scenes/scene-interconnection-matrix.md","design/scenes/S01-farm.md","design/scenes/S02-ranch.md","design/scenes/S03-flower.md","design/scenes/S04-workshop.md","design/scenes/S05-archive.md","design/scenes/S06-plaza.md","design/scenes/S07-pond.md","design/scenes/S08-store.md","design/scenes/S09-kitchen.md","design/scene-items/00-item-rules.md","design/scene-items/S01-farm-items.md","design/scene-items/S02-ranch-items.md","design/scene-items/S03-flower-items.md","design/scene-items/S04-workshop-items.md","design/scene-items/S05-archive-items.md","design/scene-items/S06-plaza-items.md","design/scene-items/S07-pond-items.md","design/scene-items/S08-store-items.md","design/scene-items/S09-kitchen-items.md","development/workflow.md","development/traceability.md","evidence/README.md","tasks/00-project-roadmap-overview.md","tasks/stage-1-foundation-cards.md","tasks/stage-2-industry-leisure-cards.md","tasks/stage-3-culinary-aesthetic-cards.md","tasks/stage-4-community-story-cards.md","tasks/stage-5-production-release-cards.md","scene-content-inventory.md","audits/2026-11-17/final_audit.md","audits/2026-11-17/full-audit/README.md","audits/2026-11-17/recheck-2.md","audits/2026-11-17/recheck.md","audits/2026-11-17/report.md"],
        depth: 3,
        hideOtherSidebarContent: true
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败'
      },
      plugins: [
        function (hook) {
          function githubSlug(text) {
            return String(text)
              .replace(/<[^>]+>/g, '')
              .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
              .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
              .replace(/`([^`]*)`/g, '$1')
              .trim()
              .toLowerCase()
              .replace(/[^\p{L}\p{N}_\- ]/gu, '')
              .replace(/ /g, '-');
          }

          function scrollToGithubAnchor() {
            var match = location.hash.match(/[?&]id=([^&]*)/);
            if (!match) return;
            var id;
            try {
              id = decodeURIComponent(match[1]);
            } catch (e) {
              id = match[1];
            }
            var target = document.getElementById(id);
            if (!target) {
              var headings = document.querySelectorAll(
                '.markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4'
              );
              for (var i = 0; i < headings.length; i++) {
                if (githubSlug(headings[i].textContent) === id) {
                  target = headings[i];
                  break;
                }
              }
            }
            if (target) target.scrollIntoView();
          }

          function markActive() {
            var path = location.hash.replace(/^#/, '').split('?')[0].replace(/\.md$/, '');
            if (path === '' || path === '/') path = '/home';
            var links = document.querySelectorAll('.sidebar-nav a');
            var best = null;
            for (var i = 0; i < links.length; i++) {
              var href = (links[i].getAttribute('href') || '').replace(/^#/, '').replace(/\.md$/, '');
              if (!href) continue;
              if ((path === href || path.indexOf(href + '/') === 0) && (!best || href.length > best.href.length)) {
                best = { link: links[i], href: href };
              }
            }
            var previous = document.querySelectorAll('.sidebar-nav li.active');
            for (var j = 0; j < previous.length; j++) previous[j].classList.remove('active');
            if (best) best.link.parentNode.classList.add('active');
          }

          hook.doneEach(function () {
            var section = document.querySelector('.markdown-section');
            if (section && !section.querySelector('.kb-footer')) {
              var footer = document.createElement('p');
              footer.className = 'kb-footer';
              footer.textContent = '构建于 2026年11月18日';
              section.appendChild(footer);
            }
            markActive();
            setTimeout(scrollToGithubAnchor, 60);
            setTimeout(scrollToGithubAnchor, 400);
          });
        }
      ]
    };
  </script>
  <script src="_assets/gate.js"></script>
</body>
</html>
